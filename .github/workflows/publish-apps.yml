name: Verificar aplicativos publicados
on:
  push:
    branches: [main]
    paths: ['releases/apps-v3.0.0.json', '.github/workflows/publish-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-apps-v3
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: falaegrup/falae-downloads
    steps:
      - name: Obter manifesto permanente
        run: gh api repos/falaegrup/falae-downloads/contents/releases/apps-v3.0.0.json --jq .content | base64 --decode > manifest.json
      - name: Baixar os arquivos publicados
        run: gh release download apps-v3.0.0 --dir installers
      - name: Conferir integridade e links do site
        shell: python
        run: |
          import json, hashlib, pathlib, urllib.request
          manifest=json.load(open('manifest.json'))
          assert manifest['version']=='3.0.0'
          root=pathlib.Path('installers')
          assert {p.name for p in root.iterdir()}=={f['file'] for f in manifest['files']}|{'SHA256SUMS.txt'}
          sums={}
          for line in (root/'SHA256SUMS.txt').read_text().splitlines():
            digest,name=line.split()
            sums[name]=digest
          assert set(sums)=={f['file'] for f in manifest['files']}
          for f in manifest['files']:
            assert pathlib.Path(f['file']).name==f['file']
            data=(root/f['file']).read_bytes()
            assert len(data)==f['size']
            assert hashlib.sha256(data).hexdigest()==f['sha256']==sums[f['file']]
            print(f['file'],len(data),'bytes; SHA-256 OK')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args):return None
          opener=urllib.request.build_opener(NoRedirect)
          files={'android':'Falae-3.0.0-android.apk','windows':'Falae-3.0.0-windows-x64.exe','macos':'Falae-3.0.0-macos-universal.dmg','linux':'Falae-3.0.0-linux-x64.AppImage'}
          for platform,name in files.items():
            request=urllib.request.Request('https://falae.pages.dev/downloads/'+platform,headers={'User-Agent':'Mozilla/5.0 FalaeRelease/3.0.0'},method='HEAD')
            try: response=opener.open(request,timeout=30)
            except urllib.error.HTTPError as error: response=error
            assert response.status==302
            assert response.headers['Location']=='https://github.com/falaegrup/falae-downloads/releases/download/apps-v3.0.0/'+name
          with urllib.request.urlopen(urllib.request.Request('https://falae.pages.dev/',headers={'User-Agent':'Mozilla/5.0 FalaeRelease/3.0.0'}),timeout=30) as response:
            html=response.read().decode()
          for platform in files: assert 'href="/downloads/'+platform+'"' in html
          print('OK: quatro instaladores íntegros e downloads publicados no site.')
