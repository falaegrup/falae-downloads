name: Publicar envios do painel Falaê
on:
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
    paths: [scripts/publish-catalog-uploads.mjs, .github/workflows/publish-catalog-uploads.yml]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: publish-catalog-uploads
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/publish-catalog-uploads.mjs
            /catalogo/uploads/manifest.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Salvar originais e confirmar a publicação no Falaê
        run: node scripts/publish-catalog-uploads.mjs
