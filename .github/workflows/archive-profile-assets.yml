name: Publicar coleção conferida
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-profile-assets.yml, scripts/finalize-profile-catalog.mjs]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-profile-assets
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/archive-profile-assets.yml
            /scripts/finalize-profile-catalog.mjs
            /catalogo/*.json
            /catalogo/README.md
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Conferir identidades e publicar o catálogo
        run: |
          node scripts/finalize-profile-catalog.mjs
          git add catalogo/catalogo.json catalogo/colecao.json catalogo/importar.json catalogo/cancelados.json catalogo/importacao.json catalogo/README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --quiet -m 'Ativar 2140 ícones e 580 banners; cancelar 26 indisponíveis e substituir avatares antigos'
            git push --quiet origin HEAD:main
          fi
